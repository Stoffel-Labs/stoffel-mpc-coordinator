[workspace]
members = ["crates/coord-shared", "crates/off-chain", "crates/on-chain", "crates/bins"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stoffel Labs Inc <contact@stoffelmpc.com>"]
homepage = "https://stoffelmpc.com"
repository = "https://github.com/Stoffel-Labs/stoffel-mpc-coordinator.git"
documentation = "https://docs.rs/stoffel-mpc-coordinator"
categories = ["cryptography", "network-programming"]
keywords = ["mpc", "coordinator", "cryptography", "json-rpc", "ethereum"]
license = "Apache-2.0"
readme = "README.md"

[workspace.dependencies]
stoffel-mpc-coordinator-shared = { version = "0.1.0", path = "crates/coord-shared" }
stoffel-mpc-coordinator-off-chain = { path = "crates/off-chain" }
stoffelmpc-mpc = { package = "stoffelcrypto", version = "0.1.1" }
stoffelnet = "0.1.1"
stoffel-vm-types = "0.1.1"
stoffel-solidity-bindings = { version = "0.1.0", git = "https://github.com/Stoffel-Labs/Stoffel-solidity-SDK.git", rev = "269fadfade9ad33cf2b3fb05b927a08ac95dc43a" }
stoffel-solidity-bindings-test = { version = "0.1.0", git = "https://github.com/Stoffel-Labs/Stoffel-solidity-SDK.git", rev = "269fadfade9ad33cf2b3fb05b927a08ac95dc43a" }
alloy = { version = "1.5.2", features = ["full", "node-bindings"] }
alloy-primitives = { version = "1.5.4" }
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
async-trait = "0.1.89"
clap = { version = "4.5.56", features = ["derive"] }
futures-util = "0.3.31"
hex = "0.4.3"
hpke = "0.13.0"
hyper = "1.8.1"
hyper-util = "0.1.20"
jsonrpsee = { version = "0.26.0", features = ["full"] }
p256 = "0.13.2"
rand = "0.9.2"
rcgen = "0.14.7"
ring = "0.17.14"
rustls = "0.23.36"
serde = "1.0.228"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tokio-rustls = "0.26.4"
tower = "0.5.3"
tracing = "0.1"
url = "2.5.8"
x509-parser = "0.18.1"
