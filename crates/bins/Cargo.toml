[package]
name = "stoffel-mpc-coordinator-bins"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
description = "Deployment and local coordinator binaries for Stoffel MPC coordinator workflows"
publish = false

[[bin]]
name = "run-coord"
path = "src/bin/run-coord.rs"

[[bin]]
name = "deploy-contract"
path = "src/bin/deploy-contract.rs"

[[bin]]
name = "generate-ids"
path = "src/bin/generate-ids.rs"

[dependencies]
stoffel-mpc-coordinator-shared = { workspace = true }
stoffel-mpc-coordinator-off-chain = { workspace = true }
stoffel-vm-types = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
stoffel-solidity-bindings-test = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
stoffelmpc-mpc = { workspace = true }
tokio = { workspace = true, features = ["time"] }
x509-parser = { workspace = true }
