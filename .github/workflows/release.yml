name: Release

# Tag pushes run the complete release sequence: validate, package, sign,
# verify, publish the publishable workspace members to crates.io, and finally
# create the GitHub Release. Manual runs can leave crates.io publishing off for
# signing-only recovery or verification runs.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0"
        required: true
        type: string
      publish_crates:
        description: "Publish the publishable workspace members to crates.io"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Package, sign, and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify Anvil is available
        run: anvil --version

      # Works for both a root package and a crates/ workspace: cargo metadata
      # --no-deps returns every workspace member either way.
      - name: Read workspace metadata
        id: meta
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          metadata = json.loads(
              subprocess.check_output([
                  "cargo", "metadata", "--no-deps", "--format-version", "1"
              ])
          )

          # Keep only publishable members (publish == [] means publish = false).
          members = [p for p in metadata["packages"] if p.get("publish") != []]

          versions = {p["version"] for p in members}
          assert len(versions) == 1, f"workspace member versions are not synced: {versions}"

          names = sorted(p["name"] for p in members)
          print(f"version={versions.pop()}")
          print(f"names={' '.join(names)}")
          PY

      - name: Check tag matches workspace version
        run: |
          tag_version="${{ steps.ref.outputs.tag }}"
          tag_version="${tag_version#v}"
          crate_version="${{ steps.meta.outputs.version }}"

          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag ${{ steps.ref.outputs.tag }} does not match workspace version $crate_version"
            exit 1
          fi

      - name: Check tag commit is contained in main
        run: |
          git fetch origin main
          git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'

      - name: Validate release
        run: |
          cargo fmt --check
          cargo check --workspace
          cargo test --doc --workspace
          cargo clippy --workspace --all-targets
          cargo test --workspace

      # `cargo publish --workspace --dry-run` is the right check once the
      # dependency graph is publishable. Until then `cargo package` gives us
      # the .crate artifacts to sign without resolving against crates.io.
      - name: Package workspace members
        run: |
          args=""
          for name in ${{ steps.meta.outputs.names }}; do
            args="$args -p $name"
          done

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish_crates }}" = "true" ]; then
            cargo publish $args --dry-run
          else
            cargo package $args --no-verify --allow-dirty
          fi

      # Snapshot the packaged crates outside target/package before anything
      # else can touch them. cargo publish repackages into target/package, so
      # signing there would attest to bytes that later get overwritten.
      - name: Stage release artifacts
        id: stage
        run: |
          stage="$RUNNER_TEMP/artifacts"
          mkdir -p "$stage"

          for name in ${{ steps.meta.outputs.names }}; do
            base="$name-${{ steps.meta.outputs.version }}.crate"
            src="target/package/$base"
            if [ ! -f "$src" ]; then
              echo "Expected $src but it is not there" >&2
              exit 1
            fi
            cp "$src" "$stage/$base"
          done

          echo "----- staged -----"
          ls -1 "$stage"

          echo "dir=$stage" >> "$GITHUB_OUTPUT"

      - name: Compute crate checksums
        id: checksum
        run: |
          stage="${{ steps.stage.outputs.dir }}"

          # Let sha256sum write its own format so `sha256sum -c` accepts it.
          ( cd "$stage" && sha256sum *.crate ) > "$stage/SHA256SUMS"

          echo "----- SHA256SUMS -----"
          cat "$stage/SHA256SUMS"

          echo "sha_file=$stage/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Check Cosign install
        run: cosign version

      - name: Sign packaged crates
        id: sign
        run: |
          stage="${{ steps.stage.outputs.dir }}"
          bundle_dir="$RUNNER_TEMP/bundles"
          mkdir -p "$bundle_dir"

          for name in ${{ steps.meta.outputs.names }}; do
            base="$name-${{ steps.meta.outputs.version }}.crate"
            echo "Signing $base"
            cosign sign-blob --yes \
              --bundle "$bundle_dir/$base.bundle" \
              "$stage/$base"
          done

          echo "bundle_dir=$bundle_dir" >> "$GITHUB_OUTPUT"

      # Fail the release here rather than in a user's terminal. This also
      # exercises the exact identity regexp published in the docs.
      - name: Verify signatures before publishing
        run: |
          stage="${{ steps.stage.outputs.dir }}"
          bundles="${{ steps.sign.outputs.bundle_dir }}"

          for name in ${{ steps.meta.outputs.names }}; do
            base="$name-${{ steps.meta.outputs.version }}.crate"
            echo "Verifying $base"
            cosign verify-blob \
              --bundle "$bundles/$base.bundle" \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(tags|heads)/.+$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$stage/$base"
          done

          ( cd "$stage" && sha256sum -c SHA256SUMS )

      - name: Check whether this version is already published
        id: published
        if: github.event_name == 'push' || inputs.publish_crates == true
        run: |
          all_exist=true
          for name in ${{ steps.meta.outputs.names }}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "stoffel-coordinator-release-ci (+https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$name/${{ steps.meta.outputs.version }}")"
            echo "$name@${{ steps.meta.outputs.version }} -> HTTP $code"
            if [ "$code" != "200" ]; then
              all_exist=false
            fi
          done
          echo "all_exist=$all_exist" >> "$GITHUB_OUTPUT"

      # To move to Trusted Publishing, register this repo + workflow as a
      # trusted publisher for EACH workspace member on crates.io, then replace
      # the env block below with rust-lang/crates-io-auth-action@v1 and delete
      # the CARGO_REGISTRY_TOKEN secret.
      - name: Publish workspace to crates.io
        if: (github.event_name == 'push' || inputs.publish_crates == true) && steps.published.outputs.all_exist == 'false'
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$(mktemp)"
          {
            echo "Released from tag ${{ steps.ref.outputs.tag }} (version ${{ steps.meta.outputs.version }})."
            echo
            echo "Crates in this release:"
            for name in ${{ steps.meta.outputs.names }}; do
              echo "- $name"
            done
            echo
            echo "commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "Crate checksums are attached as the SHA256SUMS asset."
            echo
            echo "Each .crate is signed with Sigstore and has a matching .bundle. Verify with:"
            echo
            echo "    cosign verify-blob \\"
            echo "      --bundle <crate>.bundle \\"
            echo "      --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(tags|heads)/.+\$' \\"
            echo "      --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "      <crate>"
          } > "$notes_file"

          if gh release view "${{ steps.ref.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.ref.outputs.tag }}" \
              --title "${{ steps.ref.outputs.tag }}" \
              --notes-file "$notes_file"
          else
            gh release create "${{ steps.ref.outputs.tag }}" \
              --title "${{ steps.ref.outputs.tag }}" \
              --notes-file "$notes_file"
          fi

          gh release upload "${{ steps.ref.outputs.tag }}" \
            "${{ steps.stage.outputs.dir }}"/*.crate \
            "${{ steps.checksum.outputs.sha_file }}" \
            "${{ steps.sign.outputs.bundle_dir }}"/*.bundle \
            --clobber
